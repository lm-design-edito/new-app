<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <!-- Application -->
    <script type="module" src="http://localhost:3000/shared/index.js"></script>
    
    <!-- Config -->
    <data class="dkdll" style="display: none;">
      <array class="SLOTS">
        <record>
          <record class="destination">
            <string class="selector">.slot</string>
            <string class="position">endof</string>
            <string class="reference">body</string>
          </record>
          <lm-html class="content">
            <lm-html>
              <div class="my-wrapper other-class">
                <div class="select-me" id="lol">
                  Select me !
                  <div class="pouet"></div>
                  <div class="lol"></div>
                  <div class="truc"></div>
                </div>
                <div class="select-me">Select me !
                  <div class="select-me">Select me !
                    <div class="select-me">Select me !</div>
                  </div>
                </div>
              </div>
  
              <transformer>
                
                <classList>
                  <!-- add | remove | toggle -->
                  <string>remove</string>
                  <!-- <string>additional-class</string> -->
                </classList>
  
                <querySelector>
                  <string>#lol</string>
                </querySelector>
  
                <transformSelected>
                  <string>.pouet, .lol</string>
                  <classList>
                    <string>add</string>
                    <string>ihihih</string>
                  </classList>
                </transformSelected>
              </transformer>
            </lm-html>

            <lm-html>
              <comp name="ui">
                <string class="component">icon</string>
                <string class="url">http://localhost:8080/icons/assets/alert.svg</string>
                <boolean class="asImg">true</boolean>
                <string class="maskColor">coral</string>
              </comp>
            </lm-html>


          </lm-html>
        </record>
      </array>
    </data>
  </body>
</html>

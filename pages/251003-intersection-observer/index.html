<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>

    <!-- Application -->
    <style>.dkdll { display: none; }</style>
    <script src="/shared/index.js" type="module"></script>

    <!-- Config -->
    <record class="hyperjson" style="display: none;">
      <array _key="CONFIG" _action="append">
        <record>
          <string _key="name">source</string>
          <string _key="value">./structure.html</string>
        </record>
        <record>
          <string _key="name">handlersFile</string>
          <string _key="value">./handlers.js</string>
          <!-- <string _key="value">http://localhost:3000/pages/251003-intersection-observer/handlers.js</string> -->
        </record>
      </array>

      <array _key="SLOTS" _action="append">
        <record>
          <record _key="destination">
            <string _key="selector">.slot-1</string>
          </record>
          <nodelist _key="content">
            <!-- <div style="height: 2000px; background-color: blue;"></div> -->

            <record _literal _for="intersection-observer">
              <string _key="customClass">my-io</string>
              <nodelist _key="content">
                <div style="height: 2000px; background-color: red;"></div>
              </nodelist>
              <array _key="onIntersection">
                <string>onIntersection</string>
              </array>
            </record>

            <div style="height: 2000px; background-color: blue;"></div>
          </nodelist>
        </record>
      </array>
    </record>

    <!-- Slots -->
    <div class="slot-1"></div>
  </body>
</html>
